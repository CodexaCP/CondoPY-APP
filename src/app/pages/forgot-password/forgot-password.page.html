<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="back()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ t.title }}</ion-title>
    <ion-buttons slot="end">
      <app-lang-switcher class="fp-lang"></app-lang-switcher>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding fp-content">
  <div class="fp-wrap">

    <div class="fp-head" *ngIf="!sent">
      <ion-icon name="key-outline"></ion-icon>
      <p>{{ t.lead }}</p>
    </div>

    <form *ngIf="!sent" (ngSubmit)="submit()" #f="ngForm">
      <div class="field">
        <ion-label>{{ t.label }}</ion-label>
        <ion-input [(ngModel)]="identifier" name="identifier" type="text"
                   [placeholder]="t.placeholder" autocomplete="username" fill="outline">
        </ion-input>
      </div>

      <div class="error-msg" *ngIf="errorMsg">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ errorMsg }}
      </div>

      <ion-button expand="block" type="submit" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ loading ? t.sending : t.send }}
      </ion-button>
    </form>

    <div class="fp-success" *ngIf="sent">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      <p>{{ t.sent }}</p>
      <p class="fp-hint">{{ t.hint }}</p>
      <ion-button expand="block" fill="outline" (click)="back()">{{ t.back }}</ion-button>
    </div>

  </div>
</ion-content>
