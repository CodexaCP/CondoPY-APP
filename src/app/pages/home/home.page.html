<ion-header>
  <ion-toolbar>
    <ion-title>
      <div class="toolbar-brand">
        <ion-icon name="business"></ion-icon>
        CondoPY
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false">
  <div class="page-fill">

    <!-- Greeting -->
    <div class="greeting-banner">
      <div>
        <p class="greeting-label">Bienvenido/a</p>
        <h2 class="greeting-name">{{ user?.fullName || '—' }}</h2>
        <p class="greeting-role">{{ roleLabel }}</p>
      </div>
      <div class="greeting-avatar">{{ initials }}</div>
    </div>

    <!-- Área cards -->
    <div class="areas-section">
      <p class="section-title">¿Qué querés ver?</p>

      <div class="areas-grid">

        <!-- Área Individual -->
        <div class="area-card" (click)="goToAreaIndividual()">
          <div class="area-icon-wrap">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="32" cy="19" r="10" stroke="#fff" stroke-width="3" fill="none"/>
              <path d="M12 52 C12 38 52 38 52 52" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
              <ellipse cx="32" cy="52" rx="22" ry="7" stroke="#fff" stroke-width="2.5" stroke-dasharray="4.5 3.5" fill="none"/>
            </svg>
          </div>
          <h3>Área Individual</h3>
          <p>Tus unidades y expensas</p>
        </div>

        <!-- Área Común -->
        <div class="area-card" (click)="goToAreaComun()">
          <div class="area-badge-coming">Próximamente</div>
          <div class="area-icon-wrap">
            <!--
              Logo CondoPY en blanco:
              - Torre izquierda (ancha, flat top) con ventanas tipo C/bracket
              - Torre derecha (alta, angosta) con ventanas rectangulares
              - Anexo pequeño derecha
              - Base común
              fill-rule evenodd crea huecos en las ventanas
            -->
            <svg viewBox="0 0 110 120" xmlns="http://www.w3.org/2000/svg">
              <!-- Base -->
              <rect x="4" y="110" width="102" height="7" rx="2" fill="white"/>

              <!-- Torre izquierda (ancha) + ventanas bracket como huecos -->
              <path fill-rule="evenodd" fill="white" d="
                M6,30 L6,110 L52,110 L52,30 Z
                M13,40 L13,51 L21,51 L21,44 L26,44 L26,40 Z
                M13,55 L13,66 L21,66 L21,59 L26,59 L26,55 Z
                M13,70 L13,81 L21,81 L21,74 L26,74 L26,70 Z
                M13,85 L13,96 L21,96 L21,89 L26,89 L26,85 Z
                M32,40 L32,51 L44,51 L44,40 Z
                M32,55 L32,66 L44,66 L44,55 Z
                M32,70 L32,81 L44,81 L44,70 Z
                M32,85 L32,96 L44,96 L44,85 Z
              "/>

              <!-- Torre derecha (alta, angosta) + ventanas rectangulares -->
              <path fill-rule="evenodd" fill="white" d="
                M50,10 L50,110 L76,110 L76,10 Z
                M56,20 L56,30 L70,30 L70,20 Z
                M56,35 L56,45 L70,45 L70,35 Z
                M56,50 L56,60 L70,60 L70,50 Z
                M56,65 L56,75 L70,75 L70,65 Z
                M56,80 L56,90 L70,90 L70,80 Z
              "/>

              <!-- Anexo pequeño derecho -->
              <path fill-rule="evenodd" fill="white" d="
                M74,68 L74,110 L96,110 L96,68 Z
                M79,76 L79,86 L91,86 L91,76 Z
                M79,90 L79,100 L91,100 L91,90 Z
              "/>
            </svg>
          </div>
          <h3>Área Común</h3>
          <p>Espacios del edificio</p>
        </div>

      </div>
    </div>

  </div>
</ion-content>
