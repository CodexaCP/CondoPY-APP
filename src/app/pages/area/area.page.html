<ion-tabs>
  <ion-tab-bar slot="bottom">

    <ion-tab-button tab="units" href="/area/units">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Mis unidades</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="account" href="/area/account">
      <ion-icon name="receipt-outline"></ion-icon>
      <ion-label>Expensas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="payments" href="/area/payments">
      <ion-icon name="wallet-outline"></ion-icon>
      <ion-label>Pagos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="notifications" href="/area/notifications">
      <ion-icon name="notifications-outline"></ion-icon>
      <ion-badge *ngIf="unreadCount > 0" color="danger">{{ unreadCount > 9 ? '9+' : unreadCount }}</ion-badge>
      <ion-label>Notificaciones</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/area/profile">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Mi perfil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
