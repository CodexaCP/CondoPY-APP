<ion-header>
  <ion-toolbar>
    <ion-title>Cambiar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="cp-wrap">
    <div class="cp-notice">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <p>Por seguridad, debés cambiar tu contraseña antes de continuar. Ingresá la contraseña temporal que te proporcionó el administrador en el campo "Contraseña actual".</p>
    </div>

    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="field">
        <ion-label>Contraseña actual</ion-label>
        <ion-input [(ngModel)]="current" name="current" type="password" fill="outline" required></ion-input>
      </div>
      <div class="field">
        <ion-label>Nueva contraseña</ion-label>
        <ion-input [(ngModel)]="newPass" name="newPass" type="password" fill="outline" required></ion-input>
      </div>
      <div class="field">
        <ion-label>Confirmar contraseña</ion-label>
        <ion-input [(ngModel)]="confirm" name="confirm" type="password" fill="outline" required></ion-input>
      </div>

      <div class="error-msg" *ngIf="errorMsg">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ errorMsg }}
      </div>

      <ion-button expand="block" type="submit" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        Guardar contraseña
      </ion-button>
    </form>
  </div>
</ion-content>
