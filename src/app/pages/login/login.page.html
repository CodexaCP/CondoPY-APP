<ion-content class="login-content">
  <div class="login-wrap">

    <app-lang-switcher class="login-lang"></app-lang-switcher>

    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon">
        <img src="assets/brand/expenses-icon.svg" alt="Expenses" />
      </div>
      <h1>Expenses</h1>
      <p>{{ t.tagline }}</p>
    </div>

    <!-- Form -->
    <div class="login-card">
      <form (ngSubmit)="submit()" #f="ngForm">

        <div class="field">
          <ion-label>{{ t.userLabel }}</ion-label>
          <ion-input
            [(ngModel)]="form.email"
            name="email"
            type="text"
            [placeholder]="t.userPlaceholder"
            autocomplete="username"
            required
            fill="outline"
            [class.ion-invalid]="submitted && !form.email">
          </ion-input>
        </div>

        <div class="field">
          <ion-label>{{ t.passLabel }}</ion-label>
          <ion-input
            [(ngModel)]="form.password"
            name="password"
            [type]="showPass ? 'text' : 'password'"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            fill="outline">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <ion-checkbox [(ngModel)]="rememberMe" name="rememberMe" color="primary"></ion-checkbox>
            {{ t.remember }}
          </label>
          <a class="forgot-link" (click)="goForgotPassword()">{{ t.forgot }}</a>
        </div>

        <div class="error-msg" *ngIf="errorMsg">
          <ion-icon name="alert-circle-outline"></ion-icon>
          {{ errorMsg }}
        </div>

        <ion-button expand="block" type="submit" [disabled]="loading" class="login-btn">
          <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
          {{ loading ? t.submitting : t.submit }}
        </ion-button>

      </form>
    </div>

    <!-- Acceso a la demo del Encargado: se prueba sin cuenta y con datos ficticios -->
    <div class="demo-entry">
      <p>{{ t.demoQuestion }}</p>
      <ion-button expand="block" fill="outline" class="demo-btn" (click)="goDemo()">
        <ion-icon name="play-circle-outline" slot="start"></ion-icon>
        {{ t.demoButton }}
      </ion-button>
      <small>{{ t.demoNote }}</small>
    </div>

  </div>
</ion-content>
