<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goHome()">
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Comunicados</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Loading -->
  <div *ngIf="loading" class="state-msg">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <!-- Error -->
  <div *ngIf="error && !loading" class="state-msg">
    <ion-icon name="alert-circle-outline" class="state-icon"></ion-icon>
    <p>{{ error }}</p>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && !error && items.length === 0" class="state-msg">
    <ion-icon name="megaphone-outline" class="state-icon"></ion-icon>
    <p>No hay comunicados publicados.</p>
  </div>

  <!-- Lista de comunicados -->
  <div *ngIf="!loading && items.length > 0" class="announcements-list">
    <div class="announcement-card" *ngFor="let item of items">

      <!-- Encabezado de la card -->
      <div class="card-header">
        <div class="cat-chip" [style.background]="categoryColor(item.category)">
          <ion-icon [name]="categoryIcon(item.category)"></ion-icon>
          <span>{{ item.category }}</span>
        </div>
        <span class="card-building">{{ item.buildingName }}</span>
      </div>

      <!-- Título -->
      <h3 class="card-title">{{ item.title }}</h3>

      <!-- Cuerpo -->
      <p class="card-body">{{ item.body }}</p>

      <!-- Fecha -->
      <p class="card-date">
        <ion-icon name="calendar-outline"></ion-icon>
        {{ dateLabel(item.publishedAt ?? item.createdAtUtc) }}
      </p>
      <p class="card-date" *ngIf="item.expiresAt">
        <ion-icon name="time-outline"></ion-icon>
        Vigente hasta {{ dateLabel(item.expiresAt) }}
      </p>

    </div>
  </div>

</ion-content>
